# Configuracao do Nginx para servir o SPA Angular (build de producao).
# Copiada para /etc/nginx/conf.d/default.conf pela imagem definida em frontend/Dockerfile.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressao dos artefatos textuais do SPA.
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Cabecalhos de seguranca basicos.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Healthcheck usado pelo HEALTHCHECK da imagem e pelo orquestrador.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Proxy reverso para a API Spring Boot na rede interna do compose.
    location /api/ {
        proxy_pass http://nova-roupa-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # Assets com hash no nome: cache longo e imutavel.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Roteamento do SPA: rotas do Angular Router devolvem index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
