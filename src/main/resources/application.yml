spring:
  application:
    name: nova-roupa-api
  profiles:
    # Sem SPRING_PROFILES_ACTIVE definido a aplicação sobe em dev, com contas mock e SQLite local.
    default: dev
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    defer-datasource-initialization: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 7MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # O servidor SMTP é opcional; habilite a sonda somente se ele fizer parte da disponibilidade da API.
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
    ldap:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  storage:
    dir: ${PHOTO_STORAGE_DIR:./data/uploads}
  mail:
    from: ${MAIL_FROM:no-reply@novaroupa.local}
  cors:
    # Lista separada por vírgulas; usar origens explícitas em produção.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  ldap:
    url: ${LDAP_URL:ldap://localhost:389}
    base: ${LDAP_BASE:dc=example,dc=org}
    user-dn-pattern: ${LDAP_USER_DN_PATTERN:uid={0},ou=people}
    group-search-base: ${LDAP_GROUP_SEARCH_BASE:ou=groups}
    group-search-filter: ${LDAP_GROUP_SEARCH_FILTER:(member={0})}
  jwt:
    # Vazio em dev/test (chave efémera por processo); obrigatório em prod.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  security:
    login-rate-limit:
      # Cinco tentativas por origem a cada minuto; podem ser ajustados por ambiente.
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-ms: ${LOGIN_RATE_LIMIT_WINDOW_MS:60000}
