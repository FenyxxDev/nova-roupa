services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/nova-roupa.db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-a-long-secret}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_HEALTH_ENABLED: "false"
      PHOTO_STORAGE_DIR: /data/uploads
    volumes:
      - nova-roupa-data:/data
    ports:
      - "8080:8080"
    depends_on:
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  nova-roupa-data:
